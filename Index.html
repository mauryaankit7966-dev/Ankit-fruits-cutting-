
<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fruit Cutting Game</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 overflow:hidden;
 background:linear-gradient(#101b3d,#241044);
 font-family:Arial,sans-serif;
 color:white;
 touch-action:none;
 user-select:none;
}
#game{
 display:block;
 width:100vw;
 height:100dvh;
}
#hud{
 position:absolute;
 top:15px;
 left:0;
 width:100%;
 display:flex;
 justify-content:space-around;
 align-items:center;
 font-size:20px;
 font-weight:bold;
 pointer-events:none;
}
#menu{
 position:absolute;
 inset:0;
 display:flex;
 flex-direction:column;
 justify-content:center;
 align-items:center;
 background:#080d24cc;
 text-align:center;
}
h1{font-size:38px;color:#ffdb43}
button{
 padding:14px 35px;
 border:0;
 border-radius:30px;
 background:#ffb900;
 font-size:20px;
 font-weight:bold;
 color:#222;
}
.small{font-size:14px;color:#ddd}
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
 <div>🏆 Score: <span id="score">0</span></div>
 <div>❤️ Life: <span id="life">3</span></div>
 <div>⭐ Best: <span id="best">0</span></div>
</div>

<div id="menu">
 <h1>🍉 FRUIT NINJA 🍓</h1>
 <p>फल काटो और बम से बचो!</p>
 <button id="start">START GAME</button>
 <p class="small">फल पर उंगली फेरकर काटें</p>
</div>

<script>
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");

let W,H,fruits=[],particles=[];
let score=0,life=3,best=0;
let running=false,last=0,spawn=0;
let pointer=null;
let audio=null;

const fruitTypes=[
 {emoji:"🍉",points:10},
 {emoji:"🍎",points:10},
 {emoji:"🍊",points:10},
 {emoji:"🍌",points:15},
 {emoji:"🍍",points:15},
 {emoji:"🥝",points:20},
 {emoji:"🍓",points:15},
 {emoji:"🥥",points:20}
];

try{best=Number(localStorage.getItem("fruitBest"))||0}catch(e){}
document.getElementById("best").textContent=best;

function resize(){
 W=canvas.width=window.innerWidth*devicePixelRatio;
 H=canvas.height=window.innerHeight*devicePixelRatio;
 canvas.style.width=innerWidth+"px";
 canvas.style.height=innerHeight+"px";
 ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);
 W=innerWidth;H=innerHeight;
}
window.addEventListener("resize",resize);
resize();

function sound(freq=500){
 try{
  audio=audio||new(window.AudioContext||window.webkitAudioContext)();
  if(audio.state==="suspended")audio.resume();
  let o=audio.createOscillator();
  let g=audio.createGain();
  o.connect(g);g.connect(audio.destination);
  o.frequency.value=freq;
  g.gain.setValueAtTime(.08,audio.currentTime);
  g.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.12);
  o.start();o.stop(audio.currentTime+.13);
 }catch(e){}
}

function updateHUD(){
 document.getElementById("score").textContent=score;
 document.getElementById("life").textContent=life;
 document.getElementById("best").textContent=best;
}

function createFruit(){
 const bomb=Math.random()<.13;
 const x=50+Math.random()*(W-100);
 const r=28+Math.random()*10;
 fruits.push({
  x,y:H+40,
  vx:(Math.random()-.5)*5,
  vy:-13-Math.random()*5,
  r,
  emoji:bomb?"💣":fruitTypes[Math.floor(Math.random()*fruitTypes.length)].emoji,
  points:bomb?0:10,
  bomb,
  cut:false
 });
}

function particlesAt(x,y,color){
 for(let i=0;i<12;i++){
  let a=Math.random()*Math.PI*2;
  let s=2+Math.random()*5;
  particles.push({
   x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,
   life:30,color
  });
 }
}

function startGame(){
 score=0;life=3;
 fruits=[];particles=[];
 running=true;
 last=performance.now();
 spawn=0;
 document.getElementById("menu").style.display="none";
 updateHUD();
 requestAnimationFrame(loop);
}

function gameOver(){
 running=false;
 document.getElementById("menu").style.display="flex";
 document.querySelector("#menu h1").textContent="GAME OVER!";
 document.querySelector("#menu p").textContent="आपका स्कोर: "+score;
 document.getElementById("start").textContent="PLAY AGAIN";
}

function cutFruit(f){
 if(f.cut)return;
 f.cut=true;
 if(f.bomb){
  sound(100);
  life--;
  updateHUD();
  particlesAt(f.x,f.y,"#ff3333");
  if(life<=0)gameOver();
 }else{
  sound(650);
  score+=f.points;
  particlesAt(f.x,f.y,"#ffdd55");
  if(score>best){
   best=score;
   try{localStorage.setItem("fruitBest",best)}catch(e){}
  }
  updateHUD();
 }
}

function loop(now){
 if(!running)return;
 let dt=Math.min((now-last)/16.67,2);
 last=now;

 ctx.clearRect(0,0,W,H);

 spawn+=dt;
 if(spawn>Math.max(20,65-score/100)){
  createFruit();
  if(Math.random()<.25)createFruit();
  spawn=0;
 }

 for(let i=fruits.length-1;i>=0;i--){
  let f=fruits[i];
  f.x+=f.vx*dt;
  f.y+=f.vy*dt;
  f.vy+=.30*dt;

  ctx.font=(f.r*2)+"px Arial";
  ctx.textAlign="center";
  ctx.textBaseline="middle";
  ctx.fillText(f.emoji,f.x,f.y);

  if(!f.cut && f.y>H+80) {
   if(!f.bomb){
    life--;
    updateHUD();
    if(life<=0)gameOver();
   }
   fruits.splice(i,1);
   continue;
  }
  if(f.cut||f.y>H+100)fruits.splice(i,1);
 }

 for(let i=particles.length-1;i>=0;i--){
  let p=particles[i];
  p.x+=p.vx*dt;p.y+=p.vy*dt;
  p.vy+=.15*dt;p.life-=dt;
  ctx.globalAlpha=Math.max(0,p.life/30);
  ctx.fillStyle=p.color;
  ctx.beginPath();
  ctx.arc(p.x,p.y,4,0,Math.PI*2);
  ctx.fill();
  ctx.globalAlpha=1;
  if(p.life<=0)particles.splice(i,1);
 }

 if(running)requestAnimationFrame(loop);
}

function pointerDown(e){
 const rect=canvas.getBoundingClientRect();
 pointer={
  x:e.clientX-rect.left,
  y:e.clientY-rect.top
 };
}

function pointerMove(e){
 if(!running||!pointer)return;
 const rect=canvas.getBoundingClientRect();
 let x=e.clientX-rect.left;
 let y=e.clientY-rect.top;

 for(let f of fruits){
  if(f.cut)continue;
  let d=Math.hypot(f.x-x,f.y-y);
  if(d<f.r+18)cutFruit(f);
 }
 pointer={x,y};
}

canvas.addEventListener("pointerdown",pointerDown);
canvas.addEventListener("pointermove",pointerMove);
window.addEventListener("pointerup",()=>pointer=null);
window.addEventListener("pointercancel",()=>pointer=null);

document.getElementById("start").addEventListener("click",()=>{
 document.querySelector("#menu h1").textContent="🍉 FRUIT NINJA 🍓";
 startGame();
});
</script>
</body>
  </html>
